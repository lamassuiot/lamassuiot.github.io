    }
  }

  // nodes: flat cards travel and tilt onto the isometric floor, then the 3D objects extrude from their footprint
  const ids = Object.keys(V2.N).filter(id => !V2.N[id].box);

function drawHUD(uc, st, tAuto, sub) {
  text('LAMASSU PKI', 34, 38, { size: 10, w: 700, fam: MONO, col: C.P, ls: 2.2 });

  rr(lx, ly, lw, lh, 5); g.fillStyle = 'rgba(255,255,255,0.95)'; g.fill(); g.strokeStyle = 'rgba(30,58,138,0.2)'; g.lineWidth = 1; g.stroke();
  text('CONNECTION LANGUAGE', lx + 12, ly + 16, { size: 8.2, w: 700, fam: MONO, col: C.g5, ls: 1.1 });

  drawPanel(uc, st, tAuto);
  drawUCPill(uc);
  drawSegmented(CTL.mode, easeIO(ST.gk));

  drawCamera(smooth((ST.m - 0.6) / 0.4));
}

function drawTooltip(V, id) {
  const lines = DESC[id] || [], name = id === 'lamassu' ? 'Lamassu PKI Platform' : (V.N[id].name);
  font(11.5, 650); let w = g.measureText(name).width;
  font(10.5, 450); for (const l of lines) w = Math.max(w, g.measureText(l).width);

  let x = ref.x + ref.w / 2 - w / 2, y = ref.y - h - 10;
  if (y < 100) y = ref.y + ref.h + 12;
  x = clamp(x, 10, LW - w - 10); y = clamp(y, 10, LH - h - 10);
  rr(x + 1.5, y + 2.5, w, h, 5); g.fillStyle = 'rgba(15,31,61,0.1)'; g.fill();
  rr(x, y, w, h, 5); g.fillStyle = '#ffffff'; g.fill(); g.strokeStyle = rgba(C.P, 0.45); g.lineWidth = 1; g.stroke();

// ---- input
const toLogical = ev => [(ev.clientX - offX) / S, (ev.clientY - offY) / S];
const settled = () => (ST.m === 0 || ST.m === 1);
const curView = () => ST.m >= 0.5 ? V3 : V2;
function pointer(mx, my, click) {
  // use-case dropdown
  if (ST.ddOpen) {
    const h = USE_CASES.length * DD.item + 12, inList = mx >= DD.x && mx <= DD.x + DD.w && my >= DD.y && my <= DD.y + h;
    ST.ddHover = inList ? Math.floor((my - DD.y - 6) / DD.item) : -1;
    if (ST.ddHover >= USE_CASES.length) ST.ddHover = -1;
    if (inList) { if (click && ST.ddHover >= 0) selectUC(ST.ddHover); return 'ctl'; }
    if (inCtl(CTL.uc, mx, my)) { if (click) ST.ddOpen = false; return 'ctl'; }
    if (click) { ST.ddOpen = false; return 'ctl'; }
  }
  if (inCtl(CTL.uc, mx, my)) { if (click) { ST.ddOpen = true; ST.ddHover = -1; } return 'ctl'; }
  const seg = (c, a, b, cur) => mx < c.x ? (cur === a ? b : a) : mx < c.x + c.w / 2 ? a : b;
  if (inCtl(CTL.mode, mx, my)) { if (click) setGuided(seg(CTL.mode, 'auto', 'guided', ST.guided ? 'guided' : 'auto') === 'guided'); return 'ctl'; }
  if (inCtl(CTL.level, mx, my)) { if (click) setLevel(seg(CTL.level, 'low', 'medium', ST.level)); return 'ctl'; }
  if (inCtl(CTL.view, mx, my)) { if (click) setMode(seg(CTL.view, '2d', '3d', ST.mode)); return 'ctl'; }
  ST.camHover = -1;
  if (ST.m === 1 && inRect(CAMS, mx, my)) { const i = clamp(Math.floor((mx - CAMS.x) / (CAMS.w / PRESETS.length)), 0, PRESETS.length - 1); ST.camHover = i; if (click) camPreset(i); return 'ctl'; }
  if (ST.m === 1 && inRect(CAMR, mx, my)) { if (click) camReset(); return 'ctl'; }
  ST.btnHover = null;
  if (ST.guided) {
    if (inRect(BTN.next, mx, my)) { ST.btnHover = 'next'; if (click) goStep(ST.step + 1); return 'ctl'; }
    if (inRect(BTN.prev, mx, my)) { if (click) goStep(ST.step - 1); return 'ctl'; }
    if (settled()) for (const B of BADGES) if (Math.hypot(B.x - mx, B.y - my) < 13) { if (click) goStep(B.i); return 'ctl'; }
  }

}
function orbitDown(x, y, roll) { if (ST.m !== 1) return; ST.drag = { x0: x, y0: y, x, y, t: performance.now(), moved: false, roll: !!roll }; ST.vel = [0, 0, 0]; ST.tw = null; }
function orbitMove(x, y) {
  const d = ST.drag; if (!d) return false;
  const dx = x - d.x, dy = y - d.y, now = performance.now();
  if (!d.moved && Math.hypot(x - d.x0, y - d.y0) > 4) d.moved = true;
  if (d.moved) {
    const dtt = Math.max(1, now - d.t) / 1000;
    let a = 0, b = 0, c = 0;
    if (d.roll) c = dx * 0.0065; else { a = dx * 0.0065; b = dy * 0.0055; }
    ST.th += a; const p0 = ST.ph; ST.ph = clampPh(ST.ph + b); b = ST.ph - p0; ST.rl += c;
    ST.vel = ST.vel.map((v, i) => lerp(v, [a, b, c][i] / dtt, 0.5));
  }

}
function orbitUp() { const d = ST.drag; ST.drag = null; if (d && performance.now() - d.t > 80) ST.vel = [0, 0, 0]; return d && d.moved; }
let suppressClick = false;
view.addEventListener('mousedown', ev => { const [mx, my] = toLogical(ev); if (pointer(mx, my, false) === 'ctl' || inRect(PN, mx, my) || ST.ddOpen) return; orbitDown(ev.clientX, ev.clientY, ev.shiftKey || ev.button === 2); });
view.addEventListener('contextmenu', ev => { if (ST.m === 1) ev.preventDefault(); });
window.addEventListener('mouseup', () => { suppressClick = !!orbitUp(); });
view.addEventListener('dblclick', ev => { const [mx, my] = toLogical(ev); if (ST.m === 1 && !inRect(PN, mx, my) && pointer(mx, my, false) !== 'ctl') camReset(); });
view.addEventListener('touchmove', ev => { const t = ev.touches[0]; if (t && ST.drag) { orbitMove(t.clientX, t.clientY); ev.preventDefault(); } }, { passive: false });
view.addEventListener('touchend', () => { orbitUp(); });
view.addEventListener('mousemove', ev => { if (ST.drag && orbitMove(ev.clientX, ev.clientY)) { hover = null; view.style.cursor = 'grabbing'; return; } mouse = toLogical(ev); const r = pointer(mouse[0], mouse[1], false); hover = r && r !== 'ctl' ? r : null; view.style.cursor = r ? 'pointer' : (ST.m === 1 && !inRect(PN, mouse[0], mouse[1]) ? 'grab' : 'default'); });
view.addEventListener('mouseleave', () => { hover = null; mouse = null; ST.ddHover = -1; ST.btnHover = null; });
view.addEventListener('click', ev => { if (suppressClick) { suppressClick = false; return; } const [mx, my] = toLogical(ev); mouse = [mx, my]; const r = pointer(mx, my, true); if (r === 'ctl') return; pinned = r ? (pinned === r ? null : r) : null; });
view.addEventListener('touchstart', ev => { const t = ev.touches[0]; if (!t) return; const [mx, my] = toLogical(t); mouse = [mx, my]; if (!inRect(PN, mx, my) && pointer(mx, my, false) !== 'ctl') orbitDown(t.clientX, t.clientY); const r = pointer(mx, my, true); if (r !== 'ctl') pinned = r; }, { passive: true });
window.addEventListener('keydown', ev => {
  const k = (ev.key || '').toLowerCase();
  if (k === 'escape') { ST.ddOpen = false; pinned = null; return; }
  if (k === 'v') setMode(ST.mode === '3d' ? '2d' : '3d');
  else if (k === '2') setMode('2d'); else if (k === '3') setMode('3d');
  else if (k === 'l') setLevel(ST.level === 'low' ? 'medium' : 'low');
  else if (k === 'g') setGuided(!ST.guided);
  else if (k === 'u') selectUC((ST.uc + 1) % USE_CASES.length);
  else if (k === 'q' || k === 'e') camStep(0, k === 'e' ? 45 : -45);
  else if (k === 'w' || k === 's') camStep(1, k === 'w' ? 15 : -15);
  else if (k === 'a' || k === 'd') camStep(2, k === 'd' ? 15 : -15);

// ---- frame loop
let freeze = null, last = performance.now();
const readHash = () => { const m = /t=([\d.]+)/.exec(location.hash); freeze = m ? parseFloat(m[1]) : null; };
readHash(); window.addEventListener('hashchange', readHash);
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const tm = ST.mode === '3d' ? 1 : 0, tl = ST.level === 'medium' ? 1 : 0;
  ST.m = tm > ST.m ? Math.min(tm, ST.m + dt / 1.4) : Math.max(tm, ST.m - dt / 1.4);
  ST.lv = tl > ST.lv ? Math.min(tl, ST.lv + dt / 0.95) : Math.max(tl, ST.lv - dt / 0.95);
  ST.gk = ST.guided ? Math.min(1, ST.gk + dt / 0.35) : Math.max(0, ST.gk - dt / 0.35);
  if (!ST.drag) {
    if (ST.tw) {
      const w = ST.tw, u = Math.min(1, (now - w.t0) / w.dur), k = easeIO(u);
      ST.th = lerp(w.from[0], w.to[0], k); ST.ph = lerp(w.from[1], w.to[1], k); ST.rl = lerp(w.from[2], w.to[2], k);
      if (u >= 1) ST.tw = null;
    } else if (ST.vel.some(v => Math.abs(v) > 0.002)) {
      const v = ST.vel, f = Math.exp(-dt * 3.2);
      ST.th += v[0] * dt; ST.ph = clampPh(ST.ph + v[1] * dt); ST.rl += v[2] * dt;
      ST.vel = v.map(q => q * f);
    } else ST.vel = [0, 0, 0];
  }
  if (!ST.tw && !ST.drag && ST.vel.every(v => v === 0)) { const nw = a => { a = ((a % TAU) + TAU) % TAU; return a > Math.PI ? a - TAU : a; }; ST.th = nw(ST.th); ST.rl = nw(ST.rl); }
  const ck = ST.th + ',' + ST.ph + ',' + ST.rl;
  if (ck !== ST.camKey) { V3.setCamera(ST.th, ST.ph, ST.rl); ST.camKey = ck; renderLayer3D(); }
  const uc = USE_CASES[ST.uc];
  let prog, t, tAuto = 0;
  if (ST.guided) {
    const s = uc.steps[ST.step];
    prog = s.prog; t = freeze !== null ? Math.min(freeze, s.dur) : ((now - ST.stepStart) / 1000) % (s.dur + STEP_PAUSE);
  } else {
    prog = uc.prog; tAuto = t = (freeze !== null ? freeze : (now - ST.autoStart) / 1000) % uc.total;
  }
  const fs = frameState(prog, t, ST.lv, ST.guided);
  const pst = ST.guided ? { step: uc.steps[ST.step] } : fs.st;

  g = sctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, scene.width, scene.height);
  if (ST.m === 0 || ST.m === 1) {
    const V = ST.m === 1 ? V3 : V2, Lr = layers[V.id];
    g.drawImage(Lr.grid, 0, 0); g.drawImage(Lr.zones, 0, 0);
    g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
    V.frame(fs);
    if (ST.guided) drawBadges(V, uc, ST.step, fs); else BADGES = [];
    drawHUD(uc, pst, tAuto, V.sub);
    const tip = hover || pinned; if (tip && V.N[tip]) drawTooltip(V, tip);
    drawDropdown();
  } else {
    g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
    const e = easeIO(ST.m);
    morphFrame(e, fs);
    BADGES = [];
    drawHUD(uc, pst, tAuto, e < 0.5 ? V2.sub : V3.sub);
    drawDropdown();
  }
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.fillStyle = C.bg; vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(scene, Math.round(offX * DPR), Math.round(offY * DPR));
  requestAnimationFrame(frame);
}

function renderLayer3D() {
  const L3 = layers['3d'];
  g = L3.grid.getContext('2d'); g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0); V3.renderGrid();
  g = L3.zones.getContext('2d'); g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0); g.clearRect(0, 0, LW, LH); V3.renderZones();

}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const w = window.innerWidth, h = window.innerHeight;
  view.width = Math.round(w * DPR); view.height = Math.round(h * DPR);
  S = Math.min(w / LW, h / LH); offX = (w - LW * S) / 2; offY = (h - LH * S) / 2;
  scene.width = Math.round(LW * S * DPR); scene.height = Math.round(LH * S * DPR);
  for (const [id, V] of [['3d', V3], ['2d', V2]]) {

    g = layers[id].grid.getContext('2d'); g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0); V.renderGrid();
    g = layers[id].zones.getContext('2d'); g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0); g.clearRect(0, 0, LW, LH); V.renderZones();
  }
  g = sctx;
}
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
})();
