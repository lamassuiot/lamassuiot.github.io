  else if (k === '-' || k === '_') zoomAt(LW / 2, LH / 2, 1 / 1.35);
  else if (k === '0') zoomReset();
  else if (!ST.guided && (k === ' ' || k === 'p')) { ev.preventDefault(); togglePlay(); }
  else if (ST.guided && (k === 'arrowright' || k === ' ' || k === 'enter' || k === 'pagedown')) { ev.preventDefault(); goStep(ST.step + 1); }
  else if (ST.guided && (k === 'arrowleft' || k === 'backspace' || k === 'pageup')) { ev.preventDefault(); goStep(ST.step - 1); }
});

// ---- frame loop
let freeze = null, last = performance.now();
const readHash = () => { const m = /t=([\d.]+)/.exec(location.hash); freeze = m ? parseFloat(m[1]) : null; };
readHash(); window.addEventListener('hashchange', readHash);
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const tm = ST.mode === '3d' ? 1 : 0, tl = LEVELS.indexOf(ST.level);
  ST.m = tm > ST.m ? Math.min(tm, ST.m + dt / 1.4) : Math.max(tm, ST.m - dt / 1.4);
  ST.lv = tl > ST.lv ? Math.min(tl, ST.lv + dt / 0.9) : Math.max(tl, ST.lv - dt / 0.9);
  PQV.a = PQV.on ? Math.min(1, PQV.a + dt / 0.45) : Math.max(0, PQV.a - dt / 0.45);
  for (const k in CXK) { const tg = FAMS.indexOf(CX[k]); CXK[k] += (tg - CXK[k]) * Math.min(1, dt * 12); if (Math.abs(tg - CXK[k]) < 0.002) CXK[k] = tg; }
  ST.gk = ST.guided ? Math.min(1, ST.gk + dt / 0.35) : Math.max(0, ST.gk - dt / 0.35);
  if (!ST.drag) {
    if (ST.tw) {
      const w = ST.tw, u = Math.min(1, (now - w.t0) / w.dur), k = easeIO(u);
      ST.th = lerp(w.from[0], w.to[0], k); ST.ph = lerp(w.from[1], w.to[1], k); ST.rl = lerp(w.from[2], w.to[2], k);
      if (u >= 1) ST.tw = null;
    } else if (ST.vel.some(v => Math.abs(v) > 0.002)) {
      const v = ST.vel, f = Math.exp(-dt * 3.2);
      ST.th += v[0] * dt; ST.ph = clampPh(ST.ph + v[1] * dt); ST.rl += v[2] * dt;
      ST.vel = v.map(q => q * f);
    } else ST.vel = [0, 0, 0];
  }
  if (!ST.tw && !ST.drag && ST.vel.every(v => v === 0)) { const nw = a => { a = ((a % TAU) + TAU) % TAU; return a > Math.PI ? a - TAU : a; }; ST.th = nw(ST.th); ST.rl = nw(ST.rl); }
  if (!ST.pan) { const f = Math.min(1, dt * 14); for (const k of ['k', 'x', 'y']) { Z[k] += (ZT[k] - Z[k]) * f; if (Math.abs(ZT[k] - Z[k]) < (k === 'k' ? 0.0005 : 0.05)) Z[k] = ZT[k]; } }
  const zk = Z.k + ',' + Z.x + ',' + Z.y, ck = ST.th + ',' + ST.ph + ',' + ST.rl;
  if (ck !== ST.camKey) { V3.setCamera(ST.th, ST.ph, ST.rl); ST.camKey = ck; renderLayer3D(); }
  if (zk !== zoomKey) { zoomKey = zk; renderLayerOf('3d'); renderLayerOf('2d'); }
  const uc = curUC();
  let prog, t, tAuto = 0;
  if (ST.guided) {
    const s = uc.steps[ST.step];
    prog = s.prog; t = freeze !== null ? Math.min(freeze, s.dur) : ((now - ST.stepStart) / 1000) % (s.dur + STEP_PAUSE);
  } else {
    prog = uc.prog; tAuto = t = (freeze !== null ? freeze : ST.paused ? ST.pauseT : (now - ST.autoStart) / 1000) % uc.total;
  }
  const fs = frameState(prog, t, ST.lv, ST.guided);
  const pst = ST.guided ? { step: uc.steps[ST.step] } : fs.st;

  g = sctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, scene.width, scene.height);
  if (ST.m === 0 || ST.m === 1) {
    const V = ST.m === 1 ? V3 : V2, Lr = layers[V.id];
    g.drawImage(Lr.grid, 0, 0); g.drawImage(Lr.zones, 0, 0);
    g.setTransform(...sceneXf());
    V.frame(fs);
    drawCryptoChips(V, fs);
    if (ST.guided) drawBadges(V, uc, ST.step, fs); else BADGES = [];
    g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
    drawChannelCard(V, fs);
    drawCallout(V, uc, fs, pst);
    drawHUD(uc, pst, tAuto, V.sub);
    const tip = hover || pinned; if (tip && V.N[tip]) drawTooltip(V, tip);
    drawDropdown();
  } else {
    const e = easeIO(ST.m);
    g.drawImage(layers['2d'].grid, 0, 0); g.globalAlpha = e; g.drawImage(layers['3d'].grid, 0, 0); g.globalAlpha = 1;
    g.setTransform(...sceneXf());
    morphFrame(e, fs);
    g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
    BADGES = []; CARD = CARD_BTN = null;
    drawHUD(uc, pst, tAuto, e < 0.5 ? V2.sub : V3.sub);
    drawDropdown();
  }
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.fillStyle = C.bg; vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(scene, Math.round(offX * DPR), Math.round(offY * DPR));
  requestAnimationFrame(frame);
}

function renderLayerOf(id) {
  const Lr = layers[id], V = id === '3d' ? V3 : V2, X = sceneXf();
  g = Lr.grid.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = C.bg; g.fillRect(0, 0, Lr.grid.width, Lr.grid.height); g.setTransform(...X); V.renderGrid();
  g = Lr.zones.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, Lr.zones.width, Lr.zones.height); g.setTransform(...X); V.renderZones();
  g = sctx;
}
function renderLayer3D() { renderLayerOf('3d'); }
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const w = window.innerWidth, h = window.innerHeight;
  view.width = Math.round(w * DPR); view.height = Math.round(h * DPR);
  S = Math.min(w / LW, h / LH); offX = (w - LW * S) / 2; offY = (h - LH * S) / 2;
  scene.width = Math.round(LW * S * DPR); scene.height = Math.round(LH * S * DPR);
  for (const id of ['3d', '2d']) {
    for (const k of ['grid', 'zones']) { const c = layers[id][k]; c.width = scene.width; c.height = scene.height; }
    renderLayerOf(id);
  }
  g = sctx;
}
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
})();
</script>
