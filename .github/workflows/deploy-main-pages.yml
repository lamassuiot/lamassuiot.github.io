name: Deploy main to GitHub Pages (www.lamassu.io)

# This repo is the org site (lamassuiot/lamassuiot.github.io), so it serves the
# root of www.lamassu.io. /docs, /lamassu-helm, /research, ... are served by
# their own repos' project sites under the same domain, so the docs are NOT
# merged into this build (unlike the Firebase dev deploy).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No DOCS_CLIENT_DIR and no docs checkout: merge-docs skips itself.
      - name: Build landing
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
