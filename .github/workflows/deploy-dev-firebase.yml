name: Deploy dev to Firebase Hosting (lamaland-1965e.web.app)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          repository: lamassuiot/docs
          path: _docs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install docs dependencies
        working-directory: _docs
        run: pnpm install --ignore-scripts && pnpm run postinstall

      - name: Build docs
        working-directory: _docs
        run: pnpm build

      - run: npm ci

      - name: Build landing (+ merge docs)
        run: npm run build
        env:
          DOCS_CLIENT_DIR: _docs/build/client

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LAMALAND_1965E }}
          channelId: live
          projectId: lamaland-1965e

