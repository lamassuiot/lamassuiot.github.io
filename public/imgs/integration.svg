<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="70 90 800 590" fill="none">
  <defs>
    <filter id="iso-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="5" flood-color="#10192c" flood-opacity="0.28"/>
    </filter>

    <g id="iso-server">
      <path d="M 0,-40 L 20,-50 L 0,-60 L -20,-50 Z" fill="#8fa1c3" />
      <path d="M 0,0 L 20,-10 L 20,-50 L 0,-40 Z" fill="#243550" />
      <path d="M -20,-10 L 0,0 L 0,-40 L -20,-50 Z" fill="#4a5f83" />
      <path d="M -18,-45 L -2,-37" stroke="#10192c" stroke-width="1.5" />
      <path d="M -18,-35 L -2,-27" stroke="#10192c" stroke-width="1.5" />
      <path d="M -18,-25 L -2,-17" stroke="#10192c" stroke-width="1.5" />
      <polygon points="-15,-10 -13,-9 -13,-7 -15,-8" fill="#7e9cff" />
    </g>

    <g id="iso-platform-server">
      <path d="M 0,-60 L 30,-75 L 0,-90 L -30,-75 Z" fill="#4a5f83" />
      <path d="M 0,0 L 30,-15 L 30,-75 L 0,-60 Z" fill="#10192c" />
      <path d="M -30,-15 L 0,0 L 0,-60 L -30,-75 Z" fill="#243550" />
      <path d="M -30,-45 L 0,-30 L 0,-25 L -30,-40 Z" fill="#7e9cff" />
      <polygon points="-25,-15 -20,-12.5 -20,-8.5 -25,-11" fill="#8fa1c3" />
      <polygon points="-15,-10 -10,-7.5 -10,-3.5 -15,-6" fill="#edf3ff" />
    </g>

    <g id="iso-db">
      <path d="M -20,-30 L -20,0 A 20 10 0 0 0 20,0 L 20,-30 Z" fill="#243550" />
      <ellipse cx="0" cy="-30" rx="20" ry="10" fill="#8fa1c3" />
      <path d="M -20,-15 A 20 10 0 0 0 20,-15" stroke="#10192c" stroke-width="1.5" fill="none" />
      <path d="M -20,-5 A 20 10 0 0 0 20,-5" stroke="#10192c" stroke-width="1.5" fill="none" />
    </g>

    <g id="iso-hsm">
      <path d="M 0,-10 L 40,-30 L 10,-45 L -30,-25 Z" fill="#8fa1c3" />
      <path d="M 0,0 L 40,-20 L 40,-30 L 0,-10 Z" fill="#243550" />
      <path d="M -30,-15 L 0,0 L 0,-10 L -30,-25 Z" fill="#4a5f83" />
      <path d="M -25,-12 L -5,-2" stroke="#edf3ff" stroke-width="1.5" />
      <polygon points="-25,-21 -22,-19.5 -22,-17.5 -25,-19" fill="#7e9cff" />
    </g>

    <g id="iso-computer">
      <path d="M -10,0 L -10,10 L -15,12.5 L -5,17.5 Z" fill="#8fa1c3" />
      <path d="M -20,-30 L 0,-20 L 0,0 L -20,-10 Z" fill="#b8c7e4" />
      <path d="M -18,-27 L -2,-19 L -2,-3 L -18,-11 Z" fill="#243550" />
      <path d="M -16,-24 L -4,-18 L -4,-6 L -16,-12 Z" fill="#7e9cff" />
    </g>

    <g id="iso-user">
      <path d="M -10,-5 L -10,10 A 10 5 0 0 0 10,10 L 10,-5 Z" fill="#7e9cff" />
      <ellipse cx="0" cy="-5" rx="10" ry="5" fill="#b8c7e4" />
      <circle cx="0" cy="-17" r="8" fill="#8fa1c3" />
    </g>

    <g id="cloud-cluster">
      <ellipse cx="20" cy="10" rx="100" ry="45" fill="#243550" opacity="0.72" />
      <ellipse cx="-40" cy="-10" rx="70" ry="30" fill="#4a5f83" opacity="0.64" />
      <ellipse cx="70" cy="30" rx="70" ry="35" fill="#243550" opacity="0.66" />
    </g>
  </defs>

  <g fill="none" stroke="#8fa1c3" stroke-width="2" stroke-dasharray="6 4" opacity=".72">
    <path d="M 440,360 L 330,305 L 330,200" />
    <path d="M 480,380 L 580,330 L 580,200" />
    <path d="M 520,400 L 700,310 L 700,260" />
    <path d="M 520,400 L 760,520 L 760,460" />
    <path d="M 640,460 L 740,410 L 740,350" />
    <path d="M 680,480 L 640,500 L 640,540" />
    <path d="M 480,380 L 480,620" />
    <path d="M 440,360 L 200,480" />
    <path d="M 340,410 L 240,360" />
    <path d="M 280,440 L 200,400" />
    <path d="M 240,460 L 140,410" />
  </g>

  <g transform="translate(200, 310)" filter="url(#iso-shadow)">
    <use href="#cloud-cluster" />
  </g>

  <g transform="translate(330, 200)" filter="url(#iso-shadow)">
    <use href="#iso-server" />
  </g>
  <text x="330" y="120" font-family="Manrope, sans-serif" font-weight="700" font-size="15" fill="#edf3ff" text-anchor="middle">RADIUS</text>

  <g transform="translate(580, 200)" filter="url(#iso-shadow)">
    <use href="#iso-server" />
  </g>
  <text x="580" y="130" font-family="Manrope, sans-serif" font-weight="700" font-size="15" fill="#edf3ff" text-anchor="middle">LDAP</text>

  <g transform="translate(700, 260)" filter="url(#iso-shadow)">
    <use href="#iso-db" />
  </g>
  <g transform="translate(740, 350)" filter="url(#iso-shadow)">
    <use href="#iso-hsm" />
  </g>
  <text x="750" y="310" font-family="Manrope, sans-serif" font-weight="700" font-size="15" fill="#edf3ff" text-anchor="middle">HSM</text>

  <g filter="url(#iso-shadow)">
    <g transform="translate(150, 315) scale(0.8)"><use href="#iso-db" /></g>
    <g transform="translate(180, 330) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(210, 345) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(240, 360) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(140, 370) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(170, 385) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(200, 400) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(230, 415) scale(0.8)"><use href="#iso-db" /></g>
    <g transform="translate(80, 380) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(110, 395) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(140, 410) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(300, 430) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(330, 445) scale(0.8)"><use href="#iso-server" /></g>
    <g transform="translate(360, 460) scale(0.8)"><use href="#iso-server" /></g>
  </g>

  <g filter="url(#iso-shadow)">
    <g transform="translate(440, 360)"><use href="#iso-platform-server" /></g>
    <g transform="translate(480, 380)"><use href="#iso-platform-server" /></g>
    <g transform="translate(520, 400)"><use href="#iso-platform-server" /></g>
  </g>
  <text x="480" y="248" font-family="Manrope, sans-serif" font-weight="700" font-size="18" fill="#edf3ff" text-anchor="middle">Lamassu Platform</text>

  <g transform="translate(760, 460)" filter="url(#iso-shadow)">
    <use href="#iso-server" />
  </g>
  <g filter="url(#iso-shadow)">
    <g transform="translate(680, 520)"><use href="#iso-user" /></g>
    <g transform="translate(640, 540)"><use href="#iso-computer" /></g>
  </g>

  <g filter="url(#iso-shadow)">
    <g transform="translate(480, 620)"><use href="#iso-user" /></g>
    <g transform="translate(430, 640)"><use href="#iso-server" /></g>
    <g transform="translate(530, 640)"><use href="#iso-db" /></g>
    <g transform="translate(560, 655)"><use href="#iso-db" /></g>
  </g>
</svg>
